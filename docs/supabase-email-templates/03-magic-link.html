<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link đăng nhập</title>
</head>
<body style="margin:0;padding:24px;background:#f5f3ff;font-family:Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
    <tr>
      <td align="center">
        <table role="presentation" width="620" style="max-width:620px;background:#fff;border:1px solid #ede9fe;border-radius:16px;overflow:hidden;">
          <tr>
            <td style="padding:24px;text-align:center;background:linear-gradient(135deg,#8B5CF6,#A78BFA);color:#fff;">
              <img src="https://s3-sgn10.fptcloud.com/teky-prod/teky-edu-vn/media/project_medias/2023/9/23/9RAQ3dMtpTNlxW7G_2023923151535.jpg" alt="Teky Logo" width="56" height="56" style="border-radius:50%;display:block;margin:0 auto 12px;">
              <h1 style="margin:0;font-size:24px;">Đăng nhập an toàn</h1>
              <p style="margin:8px 0 0;opacity:.95;">Magic Link một lần</p>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;color:#1F2937;line-height:1.6;">
              <p style="margin:0 0 12px;">Xin chào {{ .Email }},</p>
              <p style="margin:0 0 18px;">Bạn vừa yêu cầu đăng nhập. Nhấn nút bên dưới để truy cập nhanh, không cần mật khẩu.</p>
              <p style="text-align:center;margin:24px 0;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#8B5CF6;color:#fff;text-decoration:none;padding:12px 22px;border-radius:10px;font-weight:700;">Đăng nhập ngay</a>
              </p>
              <p style="font-size:13px;color:#6B7280;">Link có hiệu lực trong thời gian ngắn và chỉ dùng một lần.</p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px;background:#faf7ff;color:#6B7280;font-size:12px;">© Timeline Teky Hoàng Mai</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
